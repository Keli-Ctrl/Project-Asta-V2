[project]
name = "project-asta"
version = "0.1.0"
description = "Institutional-grade AI-assisted automated trading infrastructure"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.19.0",
    "metaapi-cloud-sdk>=23.1.0",
    "httpx>=0.24.0",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.0",
    "google-generativeai>=0.4.0",
    "pandas>=2.2.0",
    "numpy>=1.26.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build-meta"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
