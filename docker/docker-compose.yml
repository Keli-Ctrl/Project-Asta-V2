version: '3.8'

services:
  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ../src:/app/src
    environment:
      - DATABASE_URL=postgresql+asyncpg://user:pass@db:5432/asta
      - REDIS_URL=redis://redis:6379/0
      - METAAPI_TOKEN=${METAAPI_TOKEN}
    env_file:
      - ../.env
    depends_on:
      - db
      - redis

  db:
    image: postgres:15
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=pass
      - POSTGRES_DB=asta
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
